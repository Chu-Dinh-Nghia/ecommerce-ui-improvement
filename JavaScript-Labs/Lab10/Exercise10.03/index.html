<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise 10.3 — Bộ chọn nâng cao</title><link rel="stylesheet" href="../shared/lab.css"><script src="../shared/js/jquery-3.1.1.min.js"></script></head>
<body><header><a href="../index.html">Lab 10 — Mục lục</a></header><main><h1>Exercise 10.3 — Bộ chọn nâng cao</h1><p>Thử bộ chọn :password, :nth-child() và :contains() của jQuery.</p><section class="card"><h2>Thực hành</h2><form id="sample"><label>Tên<input value="Lan"></label><label>Mật khẩu<input type="password" value="demo"></label><label>Email<input type="email" value="lan@example.com"></label><label>Ghi chú<input value="word matching label"></label><label>Mật khẩu khác<input type="password" value="secret"></label><label>Địa chỉ<input value="Hà Nội"></label><label>Nhóm<input value="word trong label"></label><label>Thành phố<input value="Đà Nẵng"></label></form><button id="run">Áp dụng selector nâng cao</button><p id="result" class="output"></p></section><p><a href="../index.html">← Quay lại danh sách Lab 10</a></p><footer>Thư viện jQuery 3.1.1 được lưu cục bộ trong thư mục shared. Tương tác trực tiếp với các nút/vùng minh họa để quan sát kết quả.</footer></main><script>$(function(){ $("#run").on("click",function(){ $(":password").css("background-color","#fff3a6"); $("form :nth-child(4n)").css("background-color","#fff3a6"); $('label:contains(word)').css("color","#111"); $("#result").text("Đã tô vàng input password, mỗi phần tử thứ 4 trong form, và tô chữ đen cho label chứa word."); }); });</script></body></html>
