<!doctype html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Exercise 9.8 — Form Validation</title><link rel='stylesheet' href='css/lab09.css'></head><body><main><a class='back' href='../index.html'>← Mục lục Lab 09</a><h1>Exercise 9.8 — Form Validation</h1><div class="lesson">Khi submit, kiểm tra mọi trường text/password. Nếu có trường trống, gọi <code>preventDefault()</code>, liệt kê ID lỗi trong vùng <code>#errors</code>; nếu đầy đủ thì hiện thông báo hoàn tất (bài lab không gửi dữ liệu lên máy chủ).</div><form class="form-box" action="#" id="sampleForm" novalidate><label for="name">Họ tên</label><input type="text" name="name" id="name" placeholder="Họ và tên"><label for="phone">Điện thoại</label><input type="text" name="phone" id="phone" placeholder="Số điện thoại"><label for="email">Email</label><input type="text" name="email" id="email" placeholder="email@example.com"><label for="pass">Mật khẩu</label><input type="password" name="pass" id="pass" placeholder="Mật khẩu"><p><button type="submit">Register</button></p></form><div id="errors" class="hidden" role="alert" aria-live="polite"></div><p id="success" class="result hidden" aria-live="polite"></p></main><script src='js/app.js'></script></body></html>
