<!doctype html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Exercise 9.7 — Working with Forms</title><link rel='stylesheet' href='css/lab09.css'></head><body><main><a class='back' href='../index.html'>← Mục lục Lab 09</a><h1>Exercise 9.7 — Working with Forms</h1><div class="lesson">Listener <code>focus</code> tô vàng trường đang nhập; listener <code>blur</code> trả nền về trắng. Dùng Tab để lần lượt di chuyển giữa các trường.</div><form class="form-box" action="#"><label for="name">Họ tên</label><input type="text" id="name" placeholder="Họ và tên"><label for="phone">Điện thoại</label><input type="text" id="phone" placeholder="Số điện thoại"><label for="email">Email</label><input type="text" id="email" placeholder="email@example.com"><label for="pass">Mật khẩu</label><input type="password" id="pass" placeholder="Mật khẩu"><p><button type="button">Biểu mẫu minh họa</button></p></form></main><script src='js/app.js'></script></body></html>
